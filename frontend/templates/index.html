<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mantenemos el título de tu bloque original -->
    <title>Catálogo - MiTienda</title> 
    <!-- Enlazamos tu archivo de estilos de siempre -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- ================= HEADER / NAV (Lo que antes estaba en base.html) ================= -->
  <header>
      <nav class="nav-principal">
          <a href="/" class="logo">MiTienda</a>
          <div class="nav-links">
              <a href="/">Catálogo</a>
              <a href="/templates/carrito.html">Carrito</a>
              <a href="/templates/login.html">Ingresar</a>
          </div>
      </nav>
  </header>

  <!-- ================= CONTENIDO PRINCIPAL ================= -->
  <main class="contenedor">
      <h1 class="titulo-seccion">Nuestros productos</h1>

      <!-- Dejamos la grilla vacía con un ID para que JavaScript dibuje tus productos -->
      <div class="grilla-productos" id="grilla-productos">
          <!-- Las tarjetas de productos se cargarán acá dinámicamente -->
      </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer>
      <p>&copy; 2026 MiTienda - Todos los derechos reservados.</p>
  </footer>

  <!-- ================= SCRIPTS ================= -->
  <!-- Importamos tu lógica del carrito actualizada -->
  <script src="/static/js/carrito.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        const grilla = document.getElementById("grilla-productos");

        try {
            // 1. Le pedimos la lista de productos al backend de Flask a través de Nginx
            const respuesta = await fetch('/api/productos');
            if (!respuesta.ok) throw new Error("No se pudieron cargar los productos");
            const productos = await respuesta.json();

            // 2. Si no hay productos, mostramos un mensaje
            if (productos.length === 0) {
                grilla.innerHTML = "<p>No hay productos en stock actualmente.</p>";
                return;
            }

            // 3. Dibujamos tus cards respetando exactamente tu código y clases originales
            grilla.innerHTML = productos.map(producto => `
                <div class="card">
                    <img src="/static/img/${producto.imagen}" alt="${producto.nombre}">
                    <div class="card-body">
                        <h5 class="card-title">${producto.nombre}</h5>
                        <p class="card-text">${producto.descripcion}</p>
                        <p class="precio">$${producto.precio}</p>
                        <div class="card-acciones">
                            <!-- Ver detalle redirige al HTML estático del producto pasando el ID -->
                            <a href="/templates/producto.html?id=${producto.id}" class="btn btn-primary">Ver detalle</a>
                            
                            <!-- Botón para agregar al carrito llamando a la API en carrito.js -->
                            <button onclick="agregarAlCarrito(${producto.id}, 1)" class="btn btn-success">+ Agregar</button>
                        </div>
                    </div>
                </div>
            `).join('');

        } catch (error) {
            console.error("Error:", error);
            grilla.innerHTML = "<p class='error'>Error al conectar con el servidor. Intentá más tarde, gato.</p>";
        }
    });
  </script>
</body>
</html>
