<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - MiTienda</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header>
      <nav class="nav-principal">
          <a href="/" class="logo">MiTienda</a>
          <div class="nav-links">
              <a href="/">Catálogo</a>
              <a href="/templates/carrito.html">Carrito</a>
              <a href="/templates/login.html">Ingresar</a>
          </div>
      </nav>
  </header>

  <main class="contenedor">
      <form id="form-recuperar" class="form-checkout">
          <h2>Recuperar contraseña</h2>
          <div id="mensaje-error" class="error" style="display: none;"></div>
          <div id="mensaje-exito" class="confirmacion" style="display: none;"></div>

          <div class="campo">
              <label for="email">Email</label>
              <input type="email" id="email" required>
          </div>
          <div class="campo">
              <label for="password">Nueva contraseña</label>
              <input type="password" id="password" required>
          </div>
          <button type="submit" class="btn btn-primario">Actualizar</button>
      </form>
  </main>

  <footer>
      <p>&copy; 2026 MiTienda - Todos los derechos reservados.</p>
  </footer>

  <script>
    document.getElementById("form-recuperar").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById("mensaje-error");
        const exitoDiv = document.getElementById("mensaje-exito");
        
        errorDiv.style.display = "none";
        exitoDiv.style.display = "none";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const respuesta = await fetch('/api/recuperar-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const resultado = await respuesta.json();

            if (respuesta.ok) {
                exitoDiv.textContent = resultado.mensaje || "Contraseña actualizada exitosamente.";
                exitoDiv.style.display = "block";
                setTimeout(() => {
                    window.location.href = '/templates/login.html';
                }, 2000);
            } else {
                errorDiv.textContent = resultado.error || "No se pudo actualizar la contraseña.";
                errorDiv.style.display = "block";
            }
        } catch (error) {
            console.error("Error:", error);
            errorDiv.textContent = "Error de conexión con el servidor.";
            errorDiv.style.display = "block";
        }
    });
  </script>
</body>
</html>
