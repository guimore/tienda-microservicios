<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - MiTienda</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header>
      <nav class="nav-principal">
          <a href="/" class="logo">MiTienda</a>
          <div class="nav-links">
              <a href="/">Catálogo</a>
              <a href="/templates/carrito.html">Carrito</a>
              <a href="/templates/login.html">Ingresar</a>
          </div>
      </nav>
  </header>

  <!-- ================= DETALLE DEL PRODUCTO ================= -->
  <main class="contenedor" id="detalle-producto">
      <!-- Se cargará dinámicamente con JS -->
      <p>Cargando producto, bancame un toque...</p>
  </main>

  <footer>
      <p>&copy; 2026 MiTienda - Todos los derechos reservados.</p>
  </footer>

  <script src="/static/js/carrito.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        // 1. Obtener el ID del producto desde la URL (ej: producto.html?id=3)
        const params = new URLSearchParams(window.location.search);
        const productoId = params.get("id");

        if (!productoId) {
            document.getElementById("detalle-producto").innerHTML = "<h2>Producto no especificado</h2>";
            return;
        }

        try {
            // 2. Pedir los datos del producto a la API
            const respuesta = await fetch(`/api/productos/${productoId}`);
            if (!respuesta.ok) throw new Error("Producto no encontrado");
            const producto = await respuesta.json();

            // 3. Renderizar el producto manteniendo tu diseño original
            const main = document.getElementById("detalle-producto");
            main.innerHTML = `
                <div class="producto-detalle-grid">
                    <div class="producto-imagen">
                        <img src="/static/img/${producto.imagen}" alt="${producto.nombre}">
                    </div>
                    <div class="producto-info">
                        <h1>${producto.nombre}</h1>
                        <p class="descripcion">${producto.descripcion}</p>
                        <p class="precio">$${producto.precio}</p>
                        <p class="stock">Stock disponible: <strong>${producto.stock}</strong> unidades</p>
                        
                        <div class="acciones-compra">
                            <div class="form-cantidad">
                                <label for="cantidad">Cantidad:</label>
                                <input type="number" id="cantidad" value="1" min="1" max="${producto.stock}">
                            </div>
                            <!-- Botón que llama a la función de carrito.js -->
                            <button onclick="agregarAlCarrito(${producto.id}, document.getElementById('cantidad').value)" class="btn btn-success">
                                Agregar al Carrito
                            </button>
                        </div>
                    </div>
                </div>
            `;
        } catch (error) {
            console.error(error);
            document.getElementById("detalle-producto").innerHTML = "<h2>Ocurrió un error al cargar el producto.</h2>";
        }
    });
  </script>
</body>
</html>
