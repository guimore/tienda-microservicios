apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tienda-db
  template:
    metadata:
      labels:
        app: tienda-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "peronperon"  # La contraseña de tu db_2.py
        - name: MYSQL_DATABASE
          value: "tienda_db"   # El nombre de la base de datos
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  selector:
    app: tienda-db
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306