apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tienda-frontend
  template:
    metadata:
      labels:
        app: tienda-frontend
    spec:
      containers:
      - name: nginx-web
        # Reemplazá 'guidomora' por tu usuario real de Docker Hub
        image: gmm2/tienda-frontend:latest 
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort # Expone el puerto hacia afuera del clúster
  selector:
    app: tienda-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30081 # Accedés desde tu PC con http://<IP-DE-TU-NODO-K8S>:30080
